name: One-time remove all Git tags
on:
  push:
    paths:
      - .github/workflows/remove-all-tags-once.yml
permissions:
  contents: write
jobs:
  remove-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every Git tag in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref' || true)
          if [ -z "$refs" ]; then
            echo "No tags"
            exit 0
          fi
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/${ref#refs/}" --silent
            echo "Deleted $ref"
          done <<< "$refs"
